name: Build check (no deploy)

# main 이외 브랜치에 push하면 Pages와 같은 방식으로 빌드만 하고, 결과물을 artifact로 남깁니다. 배포는 하지 않습니다.
on:
  push:
    branches-ignore:
      - main
      - 'backup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - name: Bundle sizes
        run: ls -la dist/assets | sort -k5 -n
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
