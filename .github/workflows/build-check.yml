name: Build check (no deploy)

# main 이외 브랜치에 push하면 Pages와 같은 방식으로 빌드만 하고, 결과물을 artifact로 남깁니다. 배포는 하지 않습니다.
on:
  push:
    branches-ignore:
      - main
      - 'backup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - name: Smoke test in Chrome
        run: |
          python3 -m http.server 4173 -d dist >/dev/null 2>&1 &
          mkdir -p /tmp/smoke && cp scripts/smoke-test.mjs /tmp/smoke/
          cd /tmp/smoke && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0 >/dev/null
          SMOKE_CHANNEL=chrome node smoke-test.mjs http://127.0.0.1:4173/
          cd "$GITHUB_WORKSPACE"
          test -f dist/version.json && cat dist/version.json
          if grep -q vendor-excel dist/index.html; then echo 'exceljs is loaded at startup'; exit 1; fi
      - name: Bundle sizes
        run: ls -la dist/assets | sort -k5 -n
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
