name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest official household wealth statistics
        run: node scripts/update-wealth-benchmark.mjs

      - name: Fetch month-end market benchmarks
        run: node scripts/update-market-benchmarks.mjs

      - name: Build frontend
        run: pnpm exec vite build

      - name: Smoke test in Chrome (blocks deploy on failure)
        run: |
          python3 -m http.server 4173 -d dist >/dev/null 2>&1 &
          mkdir -p /tmp/smoke && cp scripts/smoke-test.mjs /tmp/smoke/
          cd /tmp/smoke && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0 >/dev/null
          SMOKE_CHANNEL=chrome node smoke-test.mjs http://127.0.0.1:4173/
          cd "$GITHUB_WORKSPACE"
          test -f dist/version.json && cat dist/version.json
          if grep -q vendor-excel dist/index.html; then echo 'exceljs is loaded at startup'; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
